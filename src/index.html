<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>爱回收标签</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f5f7fa; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; padding: 12px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { max-width: 480px; width: 100%; background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
        .header h1 { font-size: 20px; color: #2c3e50; margin-right: 10px; }
        .badge { background: #3498db; color: white; padding: 4px 14px; border-radius: 20px; font-size: 15px; font-weight: 600; }
        .name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .name-row label { font-size: 14px; color: #7f8c8d; font-weight: 500; }
        .name-row input { flex: 1; min-width: 100px; padding: 8px 12px; border: 1px solid #dce1e8; border-radius: 8px; font-size: 15px; background: #fafbfc; transition: border 0.2s; }
        .name-row input:focus { outline: none; border-color: #3498db; box-shadow: 0 0 0 3px rgba(52,152,219,0.15); }
        .btn-row { display: flex; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
        .btn { flex: 1; border: none; border-radius: 10px; padding: 14px 0; font-size: 17px; font-weight: 600; cursor: pointer; transition: 0.15s; text-align: center; min-width: 80px; }
        .btn:active { transform: scale(0.97); }
        .btn-scan { background: #3498db; color: white; }
        .btn-scan:active { background: #2980b9; }
        .btn-generate { background: #27ae60; color: white; }
        .btn-generate:active { background: #1e8449; }
        .btn-next { background: #ecf0f1; color: #2c3e50; }
        .btn-next:active { background: #d5d8dc; }
        .btn-copy { background: #f39c12; color: white; margin-top: 10px; width: 100%; border-radius: 10px; padding: 14px 0; font-size: 17px; font-weight: 600; border: none; cursor: pointer; transition: 0.15s; display: none; }
        .btn-copy:active { background: #d68910; transform: scale(0.97); }
        textarea { width: 100%; height: 80px; border: 1px solid #dce1e8; border-radius: 10px; padding: 12px; font-size: 13px; font-family: 'Courier New', monospace; background: #fafbfc; resize: vertical; transition: border 0.2s; margin-top: 4px; }
        textarea:focus { outline: none; border-color: #3498db; box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15); }
        #resultArea { background: #f8f9fa; border-radius: 10px; padding: 10px 14px; margin-top: 12px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 16px; min-height: 36px; border: 1px solid #ecf0f1; }
        .label-item { font-weight: 600; color: #7f8c8d; }
        .value-item { font-weight: 500; color: #2c3e50; }
        #textPreview { background: #fafbfc; border: 1px dashed #bdc3c7; border-radius: 10px; padding: 14px; margin-top: 12px; font-family: 'Courier New', monospace; font-size: 16px; line-height: 1.9; white-space: pre-wrap; word-break: break-all; color: #2c3e50; display: none; }
        .tip { font-size: 12px; color: #95a5a6; margin-top: 8px; line-height: 1.5; text-align: center; }
        .footer { margin-top: 16px; font-size: 12px; color: #bdc3c7; text-align: center; }
        #debugInfo { display: none; background: #fef9e7; border: 1px solid #f1c40f; border-radius: 8px; padding: 8px 12px; margin-top: 10px; font-size: 12px; color: #7f8c8d; word-break: break-all; }
        #qrOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.88); z-index: 999; display: none; justify-content: center; align-items: center; flex-direction: column; }
        #qrOverlay video { width: 75%; max-width: 380px; border-radius: 12px; background: #000; }
        #qrOverlay .close-btn { position: absolute; top: 44px; right: 28px; color: white; font-size: 32px; font-weight: 300; cursor: pointer; background: none; border: none; opacity: 0.8; }
        #qrOverlay .close-btn:active { opacity: 1; }
        #qrOverlay .scan-tip { color: #eee; font-size: 16px; margin-top: 16px; text-align: center; }
        #qrOverlay .scan-status { color: #f1c40f; font-size: 14px; margin-top: 8px; }
        #qrOverlay .manual-btn { background: #2ecc71; color: white; border: none; border-radius: 8px; padding: 10px 24px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 14px; }
        #qrOverlay .manual-btn:active { background: #27ae60; }
        .guide-text { font-size: 13px; color: #7f8c8d; text-align: center; margin: 6px 0 2px 0; line-height: 1.6; }
        @media (max-width: 480px) { .container { padding: 16px; } .btn { font-size: 15px; padding: 12px 0; } #qrOverlay video { width: 85%; } }
    </style>
</head>
<body>

<div class="container">
    <!-- ===== 顶部标题：动态显示名字 ===== -->
    <div class="header">
        <h1 id="pageTitle">❤️ 爱回收^_^小炜</h1>
        <span class="badge" id="deviceCounter">#1</span>
    </div>

    <!-- ===== 名字输入框 ===== -->
    <div class="name-row">
        <label for="nameInput">✏️ 名字</label>
        <input type="text" id="nameInput" placeholder="输入你的名字" value="小炜">
    </div>

    <div class="guide-text">
        📷 点「扫码」用摄像头识别 &nbsp;·&nbsp; 或手动粘贴 JSON
    </div>

    <div class="btn-row">
        <button class="btn btn-scan" onclick="openScanner()">📷 扫码</button>
        <button class="btn btn-generate" onclick="generate()">✅ 生成</button>
        <button class="btn btn-next" onclick="clearAndNext()">⏩ 下一台</button>
    </div>

    <textarea id="jsonInput" placeholder="或手动粘贴 JSON 数据…"></textarea>

    <div id="resultArea"><span style="color:#95a5a6;">等待扫码或粘贴…</span></div>
    <div id="textPreview"></div>
    <button class="btn btn-copy" id="copyBtn" onclick="copyText()">📋 复制标签文字</button>
    <div class="tip" id="guideTip" style="display:none;">
        ✅ 已生成。点击「复制」→ 汉印App新建文本标签 → 粘贴 → 纸张40×30mm → 打印
    </div>
    <div id="debugInfo"></div>
</div>

<div class="footer">扫码或粘贴 → 生成 → 复制 → 打印</div>

<!-- 扫码浮层 -->
<div id="qrOverlay">
    <button class="close-btn" onclick="closeScanner()">✕</button>
    <video id="qrVideo" playsinline></video>
    <div class="scan-tip">📷 将二维码放入框内</div>
    <div class="scan-status" id="qrStatus">正在启动摄像头…</div>
    <button class="manual-btn" onclick="closeScanner()">✋ 手动粘贴</button>
</div>

<script>
    // ===== 1. 名字管理 =====
    const nameInput = document.getElementById('nameInput');
    const pageTitle = document.getElementById('pageTitle');

    // 从 localStorage 读取上次保存的名字
    const savedName = localStorage.getItem('userName');
    if (savedName) {
        nameInput.value = savedName;
    }
    updateTitleAndName(); // 初始化标题

    // 监听输入变化，实时更新标题和本地存储
    nameInput.addEventListener('input', function() {
        const val = this.value.trim() || '小炜';
        localStorage.setItem('userName', val);
        updateTitleAndName();
    });

    function updateTitleAndName() {
        let name = nameInput.value.trim() || '小炜';
        // 标题显示：爱回收^_^ + 名字
        pageTitle.textContent = '❤️ 爱回收^_^' + name;
    }

    // ===== 2. 工具函数 =====
    function getDateStr() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    // 生成第一行：日期 + 空格 + [名字]
    function getFirstLine() {
        let name = nameInput.value.trim() || '小炜';
        return getDateStr() + ' ' + name;
    }

    // ===== 3. 核心变量 =====
    let deviceCounter = 1;
    let currentText = '';
    let stream = null;
    let scanInterval = null;

    // ===== 4. CPU 精简（不变） =====
    function shortenCPU(fullName) {
        if (!fullName || fullName === 'N/A') return fullName;
        let m = fullName.match(/\b(i[3579]-\d+[A-Za-z0-9]*)\b/);
        if (m) return m[1];
        m = fullName.match(/\b(m[357]?-\d+[A-Za-z0-9]*)\b/i);
        if (m) return m[1];
        m = fullName.match(/\b(Ryzen\s+\d+\s+\d+[A-Za-z0-9]*)\b/i);
        if (m) return m[1];
        m = fullName.match(/\b(A\d+-\d+)\b/);
        if (m) return m[1];
        m = fullName.match(/\b(Xeon\s+[A-Za-z0-9-]+)\b/i);
        if (m) return m[1];
        m = fullName.match(/\b(Pentium\s+[A-Za-z0-9-]+)\b/i);
        if (m) return m[1];
        m = fullName.match(/\b(Celeron\s+[A-Za-z0-9-]+)\b/i);
        if (m) return m[1];
        m = fullName.match(/\b([a-zA-Z][a-zA-Z0-9]*-\d+[A-Za-z0-9]*)\b/);
        if (m) return m[1];
        let parts = fullName.trim().split(/\s+/);
        for (let i = parts.length - 1; i >= 0; i--) {
            let p = parts[i];
            if (/\d/.test(p) && p.length >= 3 && !/^\d+\.\d+GHz$/i.test(p) && !/^\d+GHz$/i.test(p)) {
                if (i > 0 && /[a-zA-Z]/.test(parts[i - 1]) &&
                    !/^(Intel|Core|CPU|@|\(TM\))$/i.test(parts[i - 1])) {
                    return parts[i - 1] + ' ' + parts[i];
                }
                return p;
            }
        }
        return fullName.length > 20 ? fullName.substring(0, 18) + '…' : fullName;
    }

    // ===== 5. 解析并显示（使用新名字） =====
    function parseAndDisplay(jsonStr) {
        let data;
        try { data = JSON.parse(jsonStr); } catch (e) { alert('❌ JSON 格式错误，请检查'); return false; }
        const sn = data?.MB?.SN || 'N/A';
        const rawCpu = data?.CPUs?.[0]?.Name || 'N/A';
        const cpu = shortenCPU(rawCpu);
        const mem = data?.MEM?.Size || 'N/A';
        const hddObj = data?.HDDs || {};
        const hdd = hddObj.HDD || 0;
        const ssd = hddObj.SSD || 0;
        let diskParts = [];
        if (hdd) diskParts.push('HDD:' + hdd + 'GB');
        if (ssd) diskParts.push('SSD:' + ssd + 'GB');
        let disk = diskParts.length ? diskParts.join(', ') : 'N/A';
        let diskClean = disk !== 'N/A' ? disk.replace(/HDD:/g, '').replace(/SSD:/g, '') : 'N/A';

        document.getElementById('debugInfo').innerHTML =
            `<strong>🔍 调试</strong> · 原始CPU：${rawCpu}<br>→ 精简后：${cpu}`;
        document.getElementById('debugInfo').style.display = 'block';

        document.getElementById('resultArea').innerHTML = `
            <span><span class="label-item">SN</span> <span class="value-item">${sn}</span></span>
            <span><span class="label-item">CPU</span> <span class="value-item">${cpu}</span></span>
            <span><span class="label-item">RAM</span> <span class="value-item">${mem}GB</span></span>
            <span><span class="label-item">DISK</span> <span class="value-item">${diskClean}</span></span>
        `;

        // 第一行使用动态名字
        const firstLine = getFirstLine();
        const lines = [firstLine, sn, cpu, mem + ' GB', diskClean];
        currentText = lines.join('\n');

        document.getElementById('textPreview').textContent = currentText;
        document.getElementById('textPreview').style.display = 'block';
        document.getElementById('copyBtn').style.display = 'block';
        document.getElementById('guideTip').style.display = 'block';
        return true;
    }

    // ===== 6. 生成、复制、下一台（与原逻辑一致） =====
    function generate() {
        const input = document.getElementById('jsonInput').value.trim();
        if (!input) { alert('请先扫码或粘贴 JSON 数据'); return; }
        parseAndDisplay(input);
    }

    function copyText() {
        if (!currentText) { alert('请先生成标签'); return; }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(currentText)
                .then(() => alert('✅ 已复制到剪贴板！'))
                .catch(() => fallbackCopy());
        } else { fallbackCopy(); }
    }
    function fallbackCopy() {
        const ta = document.createElement('textarea');
        ta.value = currentText;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); alert('✅ 已复制到剪贴板！'); } catch (e) { alert('❌ 复制失败，请手动复制'); }
        document.body.removeChild(ta);
    }

    function clearAndNext() {
        closeScanner();
        document.getElementById('jsonInput').value = '';
        document.getElementById('textPreview').style.display = 'none';
        document.getElementById('copyBtn').style.display = 'none';
        document.getElementById('guideTip').style.display = 'none';
        document.getElementById('debugInfo').style.display = 'none';
        document.getElementById('resultArea').innerHTML = '<span style="color:#95a5a6;">等待扫码或粘贴…</span>';
        currentText = '';
        deviceCounter++;
        document.getElementById('deviceCounter').innerText = '#' + deviceCounter;
        document.getElementById('jsonInput').focus();
        window.scrollTo(0, 0);
    }

    // ===== 7. 扫码功能（完全不变） =====
    function openScanner() {
        const overlay = document.getElementById('qrOverlay');
        const video = document.getElementById('qrVideo');
        const status = document.getElementById('qrStatus');
        overlay.style.display = 'flex';
        status.textContent = '⏳ 正在启动摄像头…';
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            status.textContent = '❌ 浏览器不支持摄像头，请手动粘贴';
            return;
        }
        navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 }, advanced: [{ focusMode: 'continuous' }] }
        }).then(function(s) {
            stream = s;
            video.srcObject = s;
            video.play();
            status.textContent = '📷 请将二维码放入框内…';
            if (scanInterval) clearInterval(scanInterval);
            scanInterval = setInterval(function() {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    scanQR(video);
                }
            }, 180);
        }).catch(function(err) {
            status.textContent = '❌ 摄像头启动失败：' + err.message + '，请手动粘贴';
            console.error(err);
        });
    }

    function scanQR(video) {
        if (typeof jsQR === 'undefined') {
            document.getElementById('qrStatus').textContent = '⚠️ 扫码库未加载，请手动粘贴';
            clearInterval(scanInterval);
            scanInterval = null;
            return;
        }
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: "dontInvert",
            greyScaleWeights: { red: 0.3, green: 0.6, blue: 0.1 }
        });
        if (code && code.data) {
            document.getElementById('qrStatus').textContent = '✅ 识别成功！';
            closeScanner();
            document.getElementById('jsonInput').value = code.data;
            parseAndDisplay(code.data);
        }
    }

    function closeScanner() {
        if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
        if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
        document.getElementById('qrOverlay').style.display = 'none';
        document.getElementById('qrVideo').srcObject = null;
    }

    // ===== 8. 键盘快捷键 =====
    document.getElementById('jsonInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); generate(); }
    });
    window.addEventListener('beforeunload', function() { closeScanner(); });
</script>
</body>
</html>
